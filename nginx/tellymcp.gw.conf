# Example nginx vhost for a gateway-only or both-mode TellyMCP node.
#
# Drop this into something like:
#   /etc/nginx/conf.d/tellymcp.gw.conf
#
# Assumptions:
# - TellyMCP listens on 127.0.0.1:8080
# - ROOT_PREFIX=/api
# - public host is tellymcp.undoo.ru
# - TLS is terminated elsewhere, or you will add your own listen 443 / cert config

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tellymcp_gateway_upstream {
    server 127.0.0.1:8090;
    keepalive 32;
}

# --- rate limiting zones (http-level) ---
limit_req_zone  $binary_remote_addr zone=tellymcp_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=tellymcp_auth:10m    rate=1r/s;
limit_conn_zone $binary_remote_addr zone=tellymcp_perip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    # listen      443 ssl;

    server_name drd.undoo.ru;


    client_max_body_size 32m;

    # Gateway websocket used by distributed clients.
    location /api/gateway/ws {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
	limit_conn tellymcp_perip 20;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/gateway/live/ws {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
	limit_conn tellymcp_perip 20;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Short-lived file uploads/downloads used by get_file(type="url").
    # Tokens are carried in the URL, so keep this route out of access logs.
    location ^~ /api/files/ {
        access_log off;
        client_max_body_size 32m;
	limit_req zone=tellymcp_auth burst=5 nodelay;
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # MCP streamable HTTP endpoint:
    # disable proxy buffering so long-lived SSE/stream responses are not coalesced or cut early.
    location ~ ^/api/mcp/?$ {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OAuth discovery for Claude and other clients using RFC 8414
    # path-insertion discovery with the /api issuer path.
    location ~ ^/\.well-known/(oauth-authorization-server|openid-configuration|oauth-protected-resource)/api(/.*)?$ {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # OAuth protected-resource discovery under the public /api prefix.
    location = /api/.well-known/oauth-protected-resource {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/.well-known/oauth-protected-resource/ {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/.well-known/oauth-authorization-server {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/.well-known/jwks.json {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/oauth/authorize {
        client_max_body_size 64k;
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /api/oauth/token {
        limit_except POST { deny all; }
        client_max_body_size 64k;
	limit_req zone=tellymcp_auth burst=5 nodelay;
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # Telegram-login OAuth sub-flow: /login redirects to oauth.telegram.org,
    # /callback holds the connection open while waiting for the admin to tap
    # Approve/Reject in Telegram (up to ~5 minutes), so it needs a longer
    # read timeout than the general /api/ catch-all's default would allow if
    # nginx's own default (60s) applied per-location.
    location ^~ /api/oauth/tg/ {
        limit_except GET { deny all; }
	limit_req zone=tellymcp_auth burst=5 nodelay;
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # Everything else under /api goes to the same standalone HTTP listener:
    # - /api/webapp
    # - /api/gateway
    # - /api/healthz
    location /api/ {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
	limit_req zone=tellymcp_general burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Public landing page + Privacy Policy / Terms of Service, served by the
    # gateway itself (not static files in nginx). Lives outside /api so it is
    # reachable at the bare /tellymcp path, e.g. for app-store review links.
    location ^~ /tellymcp {
        proxy_pass http://tellymcp_gateway_upstream;
        proxy_http_version 1.1;
	limit_req zone=tellymcp_general burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/drd.undoo.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/drd.undoo.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = drd.undoo.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      80;

    server_name drd.undoo.ru;
    return 404; # managed by Certbot


}

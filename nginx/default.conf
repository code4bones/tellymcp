# TLS terminates at Nginx Proxy Manager. Preserve its original HTTPS scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

upstream tellymcp_gateway {
    zone tellymcp_gateway 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server tellymcp-gateway:8080 resolve;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 32m;

    # File download URLs and OAuth requests may contain short-lived credentials.
    access_log off;

    # Preserve paths, including /api and root-level OAuth discovery endpoints.
    location / {
        proxy_pass http://tellymcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  tags:
    - telly_savant

stages:
  - build
  - deploy

build:gateway:
  stage: build
  timeout: 30m
  script:
    - bash tools/build-package-artifact.sh
    - bash tools/build-gateway-image.sh
  artifacts:
    expire_in: 30 days
    paths:
      - deadragdoll-tellymcp-*.tgz
    reports:
      dotenv: build.env

deploy:gateway:
  stage: deploy
  timeout: 10m
  resource_group: tellymcp-production
  interruptible: false
  environment:
    name: production
    url: https://tellymcp.deadragdoll.net
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  needs:
    - job: build:gateway
      artifacts: true
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD
    - bash tools/deploy-gateway.sh
